name: Owl native Mac app

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['clients/macos/**', '.github/workflows/macos-app.yml']
  pull_request:
    paths: ['clients/macos/**', '.github/workflows/macos-app.yml']

permissions:
  contents: read

concurrency:
  group: owl-mac-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mac-app:
    runs-on: macos-26
    defaults:
      run:
        working-directory: clients/macos
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Show native toolchain
        run: xcrun swift --version
      - name: Test persistence and upload contracts
        run: xcrun swift test -c release
      - name: Build signed development app
        run: bash build-app.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Owl-macOS-development
          path: clients/macos/artifacts/Owl-macOS-arm64.zip
          retention-days: 14
