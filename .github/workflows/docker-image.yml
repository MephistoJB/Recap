name: Recap container release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: recap-image-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Test transcription provider boundaries
        run: python3 -m unittest discover -s tests/unit -v

  image:
    needs: test
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/mephistojb/recap
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - name: Build ARM64 server image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          platforms: linux/arm64
          load: true
          push: false
          tags: ${{ env.IMAGE }}:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/MephistoJB/Recap
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test the actual image and Python dependency imports
        run: |
          docker run --rm "$IMAGE:sha-$GITHUB_SHA" --help
          docker run --rm --entrypoint python "$IMAGE:sha-$GITHUB_SHA" -c \
            'from recap.server.main import create_server_app; from recap.core.config import Configuration; import whisperx; print("Server imports OK")'
      - name: Validate the deployment configuration with the actual image
        run: |
          docker run --rm --entrypoint python \
            --mount "type=bind,src=$PWD/deploy/config.example.yaml,dst=/config/config.yaml,readonly" \
            "$IMAGE:sha-$GITHUB_SHA" -c \
            'from recap.core.config import Configuration; config = Configuration.load_config_yaml("/config/config.yaml"); assert config.deepgram.language == "de"; print("Deployment configuration OK")'
      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish tested image
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          docker push "$IMAGE:sha-$GITHUB_SHA"
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            version="${GITHUB_REF#refs/tags/}"
            docker tag "$IMAGE:sha-$GITHUB_SHA" "$IMAGE:$version"
            docker push "$IMAGE:$version"
            if [[ "$version" != *-* ]]; then
              docker tag "$IMAGE:sha-$GITHUB_SHA" "$IMAGE:latest"
              docker push "$IMAGE:latest"
            fi
          fi
          {
            echo "### Recap ARM64 image"
            echo "Image: \`$IMAGE:sha-$GITHUB_SHA\`"
            echo 'Unit tests and image import smoke tests passed before publication.'
          } >> "$GITHUB_STEP_SUMMARY"
